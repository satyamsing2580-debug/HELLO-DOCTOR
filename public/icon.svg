<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="crossGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Soft Glow ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Medical Cross Badge -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="220" y="112" width="72" height="288" rx="20" fill="url(#crossGlow)" />
    <!-- Horizontal bar -->
    <rect x="112" y="220" width="288" height="72" rx="20" fill="url(#crossGlow)" />
  </g>

  <!-- Central Stethoscope & Pulse Emblem -->
  <!-- Stethoscope tube curves -->
  <path d="M196 230 C196 300 316 300 316 230" fill="none" stroke="#0284c7" stroke-width="18" stroke-linecap="round" />
  <path d="M256 285 L256 345" fill="none" stroke="#0284c7" stroke-width="18" stroke-linecap="round" />
  <circle cx="256" cy="355" r="22" fill="#0f766e" stroke="#ffffff" stroke-width="6" />

  <!-- Heart pulse wave in center -->
  <path d="M185 256 L220 256 L235 224 L255 288 L275 240 L290 256 L325 256" fill="none" stroke="#e11d48" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Little bright sparkles -->
  <circle cx="370" cy="140" r="10" fill="#38bdf8" />
  <circle cx="140" cy="370" r="8" fill="#2dd4bf" />
</svg>